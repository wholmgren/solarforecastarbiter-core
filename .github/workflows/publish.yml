name: Upload to PyPI
on:
  push:
    tags:
      - "1.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'solararbiter/solarforecastarbiter-core'
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm reads the version from git tags
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Build
        run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_password }}
