name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6

      - name: Ruff
        run: uv run --locked --only-group lint ruff check --output-format=github

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm reads the version from git tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras --no-default-groups --group doc

      - name: Sphinx
        run: uv run --no-sync make -C docs html SPHINXOPTS="-W --keep-going"

  test:
    name: test (${{ matrix.resolution }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # the versions in uv.lock
          - resolution: locked
            sync-args: --locked
          # the lower bounds declared in pyproject.toml
          - resolution: lowest-direct
            sync-args: --resolution lowest-direct
          # the newest releases allowed by pyproject.toml
          - resolution: highest
            sync-args: --upgrade

    steps:
      - uses: actions/checkout@v5
        with:
          # setuptools-scm reads the version from git tags
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: >-
          uv sync ${{ matrix.sync-args }}
          --all-extras --no-default-groups --group test

      - name: List installed packages
        run: uv pip list

      - name: Pytest
        run: >-
          uv run --no-sync pytest --pyargs solarforecastarbiter
          --cov --cov-report=term:skip-covered
