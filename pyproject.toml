[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "solarforecastarbiter"
description = "Core framework for Solar Forecast Arbiter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    {name = "Solar Forecast Arbiter Team", email = "info@solarforecastarbiter.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "click",
    "netCDF4",
    "numpy>=1.26, <2",
    "pandas>=1.5, <2",
    "requests",
    "xarray",
    "tables",
    "pvlib>=0.10",
    "scipy>=1.11",
    "statsmodels",
    "jsonschema",
    "pytz",
]
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-mock",
    "pytest-asyncio",
    "requests-mock",
    "pytest-timeout",
]
fetch = ["aiohttp", "loky"]
log = ["sentry-sdk"]
plotting = [
    "bokeh>=2.4, <3",
    "matplotlib>=3.6",
    "plotly>=5, <6",
    "selenium<4",
    "jinja2",
    "kaleido<0.3",
]
doc = ["sphinx<2.0", "sphinx_rtd_theme"]
all = ["solarforecastarbiter[test,fetch,log,plotting,doc]"]

[project.urls]
"Bug Reports" = "https://github.com/solararbiter/solarforecastarbiter-core/issues"
Source = "https://github.com/solararbiter/solarforecastarbiter-core"
Documentation = "https://solarforecastarbiter-core.readthedocs.io"

[project.scripts]
solararbiter = "solarforecastarbiter.cli:cli"

[tool.setuptools.packages.find]
include = ["solarforecastarbiter*"]

[tool.setuptools_scm]
version_file = "solarforecastarbiter/_version.py"
