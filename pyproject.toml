[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "solarforecastarbiter"
description = "Core framework for Solar Forecast Arbiter"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
authors = [
    {name = "Solar Forecast Arbiter Team", email = "info@solarforecastarbiter.org"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "jsonschema>=4.17",
    "netCDF4>=1.6.2",
    "numpy>=1.26, <2",
    "pandas>=2, <3",
    "pvlib>=0.10",
    "pytz>=2022.7",
    "requests>=2.28",
    "scipy>=1.11",
    "statsmodels>=0.14",
    # first release with macOS arm64 wheels
    "tables>=3.10",
    "urllib3>=1.26",
    "xarray>=2023.1",
]
dynamic = ["version"]

[project.optional-dependencies]
fetch = ["aiohttp>=3.8.4", "loky>=3.3"]
log = ["sentry-sdk>=1.14"]
plotting = [
    "bokeh>=3.4",
    "jinja2>=3.1",
    "kaleido>=0.2.1, <0.3",
    "matplotlib>=3.6",
    "plotly>=5, <6",
    "selenium>=3.141, <4",
]
all = ["solarforecastarbiter[fetch,log,plotting]"]

[project.urls]
"Bug Reports" = "https://github.com/solararbiter/solarforecastarbiter-core/issues"
Source = "https://github.com/solararbiter/solarforecastarbiter-core"
Documentation = "https://solarforecastarbiter-core.readthedocs.io"

[project.scripts]
solararbiter = "solarforecastarbiter.cli:cli"

[dependency-groups]
test = [
    "pytest>=7.2",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4",
    "pytest-mock>=3.10",
    "pytest-timeout>=2.1",
    "requests-mock>=1.10",
]
lint = ["ruff>=0.6"]
doc = ["sphinx>=8", "sphinx-rtd-theme>=3"]
dev = [{include-group = "test"}, {include-group = "lint"}]

[tool.setuptools.packages.find]
include = ["solarforecastarbiter*"]

[tool.setuptools_scm]
version_file = "solarforecastarbiter/_version.py"

[tool.uv]
# Make the lock pick versions with wheels for CI and development machines
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.coverage.run]
source = ["solarforecastarbiter"]
omit = ["solarforecastarbiter/_version.py"]
